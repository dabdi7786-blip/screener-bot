<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screener v2 — {{DATE}}</title>
<style>
:root {
  --bg: #0F1117; --bg2: #1A1D27; --bg3: #22263A;
  --text: #E2E8F0; --muted: #94A3B8; --border: #2D3748;
  --green: #22C55E; --blue: #60A5FA; --amber: #F59E0B;
  --purple: #A78BFA; --red: #F87171;
  --accent: #3B82F6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
header .meta { color: var(--muted); font-size: 12px; }
.controls { padding: 12px 24px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.search { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px; width: 180px; outline: none; }
.search:focus { border-color: var(--accent); }
.filter-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all .15s; }
.filter-btn:hover { color: var(--text); border-color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
select.sector-filter { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; font-size: 12px; outline: none; cursor: pointer; }
.table-wrap { overflow-x: auto; padding: 0 24px 24px; }
table { width: 100%; border-collapse: collapse; margin-top: 16px; min-width: 900px; }
th { background: var(--bg2); color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: var(--text); }
th .sort-arrow { margin-left: 4px; opacity: .4; }
th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr.data-row { cursor: pointer; transition: background .1s; }
tr.data-row:hover { background: var(--bg2); }
tr.data-row.expanded { background: var(--bg2); }
tr.detail-row td { padding: 0; }
.detail-panel { background: var(--bg3); border-bottom: 2px solid var(--accent); padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
.detail-col h4 { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.kv-table { width: 100%; }
.kv-table tr td:first-child { color: var(--muted); font-size: 12px; padding: 3px 0; width: 55%; }
.kv-table tr td:last-child { font-size: 13px; font-weight: 500; padding: 3px 0; }
.ai-block { background: var(--bg2); border-left: 3px solid var(--accent); padding: 12px 14px; border-radius: 0 6px 6px 0; font-size: 13px; line-height: 1.6; color: var(--text); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge-green  { background: rgba(34,197,94,.15);  color: var(--green); }
.badge-red    { background: rgba(248,113,113,.15); color: var(--red); }
.badge-amber  { background: rgba(245,158,11,.15);  color: var(--amber); }
.badge-blue   { background: rgba(96,165,250,.15);  color: var(--blue); }
.badge-purple { background: rgba(167,139,250,.15); color: var(--purple); }
.badge-gray   { background: rgba(148,163,184,.1);  color: var(--muted); }
.score-bar { display: flex; align-items: center; gap: 8px; }
.score-bar .bar { height: 6px; border-radius: 3px; background: var(--border); flex: 1; max-width: 80px; }
.score-bar .fill { height: 100%; border-radius: 3px; }
.no-results { text-align: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>📊 Screener v2</h1>
  <span class="meta">Дата: {{DATE}} · Тикеров: <span id="count">0</span></span>
</header>
<div class="controls">
  <input class="search" id="search" placeholder="Поиск по тикеру..." oninput="applyFilters()">
  <button class="filter-btn active" data-rating="all" onclick="setRatingFilter(this)">Все</button>
  <button class="filter-btn" data-rating="Strong Buy" onclick="setRatingFilter(this)">Strong Buy</button>
  <button class="filter-btn" data-rating="Buy+Watch" onclick="setRatingFilter(this)">Buy+Watch</button>
  <button class="filter-btn" data-rating="Watch" onclick="setRatingFilter(this)">Watch</button>
  <button class="filter-btn" data-rating="Wait" onclick="setRatingFilter(this)">Wait</button>
  <button class="filter-btn" data-rating="Skip" onclick="setRatingFilter(this)">Skip</button>
  <select class="sector-filter" id="sectorFilter" onchange="applyFilters()">
    <option value="all">Все секторы</option>
  </select>
</div>
<div class="table-wrap">
  <table id="mainTable">
    <thead>
      <tr>
        <th onclick="sortBy('rank')">#<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('ticker')">Тикер<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('name')">Компания<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('sector')">Сектор<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('rating')">Рейтинг<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('final_score')">Скор<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('rev_growth')">Rev G%<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('eps_growth')">EPS G%<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('gross_margin')">GM%<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('rsi')">RSI<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('rs_vs_etf')">RS vs ETF<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('trend')">Тренд<span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('short_pct')">Short%<span class="sort-arrow">↕</span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="noResults" class="no-results" style="display:none">Ничего не найдено</div>
</div>
<script>
const DATA = {{DATA_JSON}};

const RATING_ORDER = {"Strong Buy":0,"Buy+Watch":1,"Watch":2,"Wait":3,"Skip":4};
const RATING_CLASS = {
  "Strong Buy":"badge-green","Buy+Watch":"badge-blue",
  "Watch":"badge-amber","Wait":"badge-purple","Skip":"badge-red"
};
const TREND_LABEL = {"up":"▲ Восходящий","down":"▼ Нисходящий","neutral":"→ Нейтральный"};
const TREND_CLASS = {"up":"badge-green","down":"badge-red","neutral":"badge-gray"};

let sortKey = "final_score", sortAsc = false;
let ratingFilter = "all", openTicker = null;

// Populate sector filter
const sectors = [...new Set(DATA.map(d => d.sector))].sort();
const sf = document.getElementById("sectorFilter");
sectors.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = s; sf.appendChild(o); });

function pct(v) { return v != null ? (v >= 0 ? "+" : "") + v.toFixed(1) + "%" : "—"; }
function fmt(v, dec=1) { return v != null ? v.toFixed(dec) : "—"; }

function ratingBadge(r) {
  return `<span class="badge ${RATING_CLASS[r]||'badge-gray'}">${r}</span>`;
}

function scoreBar(score) {
  const pct = Math.min(100, Math.max(0, score / 95 * 100));
  const color = score >= 65 ? "var(--green)" : score >= 50 ? "var(--blue)" : score >= 38 ? "var(--amber)" : score >= 25 ? "var(--purple)" : "var(--red)";
  return `<div class="score-bar"><strong>${score.toFixed(1)}</strong><div class="bar"><div class="fill" style="width:${pct}%;background:${color}"></div></div></div>`;
}

function setRatingFilter(btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  ratingFilter = btn.dataset.rating;
  applyFilters();
}

function sortBy(key) {
  if (sortKey === key) { sortAsc = !sortAsc; }
  else { sortKey = key; sortAsc = key === "ticker" || key === "name" || key === "sector"; }
  document.querySelectorAll("th").forEach(th => th.classList.remove("sorted"));
  const idx = ["rank","ticker","name","sector","rating","final_score","rev_growth","eps_growth","gross_margin","rsi","rs_vs_etf","trend","short_pct"].indexOf(key);
  if (idx >= 0) document.querySelectorAll("th")[idx].classList.add("sorted");
  applyFilters();
}

function applyFilters() {
  const search = document.getElementById("search").value.toLowerCase().trim();
  const sector = document.getElementById("sectorFilter").value;
  let rows = DATA.slice();
  if (ratingFilter !== "all") rows = rows.filter(d => d.rating === ratingFilter);
  if (sector !== "all") rows = rows.filter(d => d.sector === sector);
  if (search) rows = rows.filter(d => d.ticker.toLowerCase().includes(search) || d.name.toLowerCase().includes(search));
  rows.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === "rating") { va = RATING_ORDER[va]??9; vb = RATING_ORDER[vb]??9; }
    if (va == null) va = sortAsc ? Infinity : -Infinity;
    if (vb == null) vb = sortAsc ? Infinity : -Infinity;
    if (typeof va === "string") return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortAsc ? va - vb : vb - va;
  });
  render(rows);
}

function render(rows) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  document.getElementById("count").textContent = rows.length;
  document.getElementById("noResults").style.display = rows.length ? "none" : "block";
  rows.forEach((d, i) => {
    const tr = document.createElement("tr");
    tr.className = "data-row" + (openTicker === d.ticker ? " expanded" : "");
    tr.dataset.ticker = d.ticker;
    tr.innerHTML = `
      <td>${i+1}</td>
      <td><strong>${d.ticker}</strong></td>
      <td style="color:var(--muted)">${d.name}</td>
      <td><span class="badge badge-gray">${d.sector}</span></td>
      <td>${ratingBadge(d.rating)}</td>
      <td>${scoreBar(d.final_score)}</td>
      <td>${pct(d.rev_growth != null ? d.rev_growth*100 : null)}</td>
      <td>${pct(d.eps_growth != null ? d.eps_growth*100 : null)}</td>
      <td>${d.gross_margin != null ? (d.gross_margin*100).toFixed(1)+"%" : "—"}</td>
      <td style="color:${d.rsi<30?'var(--red)':d.rsi>70?'var(--amber)':'var(--green)'}">${fmt(d.rsi)}</td>
      <td>${pct(d.rs_vs_etf)}</td>
      <td><span class="badge ${TREND_CLASS[d.trend]||'badge-gray'}">${TREND_LABEL[d.trend]||d.trend}</span></td>
      <td>${d.short_pct != null ? d.short_pct.toFixed(1)+"%" : "—"}</td>`;
    tr.onclick = () => toggleDetail(d, tr);
    tbody.appendChild(tr);
    if (openTicker === d.ticker) {
      tbody.appendChild(buildDetailRow(d));
    }
  });
}

function toggleDetail(d, tr) {
  if (openTicker === d.ticker) {
    openTicker = null;
  } else {
    openTicker = d.ticker;
  }
  applyFilters();
}

function buildDetailRow(d) {
  const tr = document.createElement("tr");
  tr.className = "detail-row";
  const td = document.createElement("td");
  td.colSpan = 13;
  const sd = d.sector_data || {};
  const td2 = d.tech_data || {};
  const id2 = d.inst_data || {};
  const cd  = d.catalyst_data || {};
  const eq  = d.eps_quality_data || {};

  // Column 1: Sector metrics
  const sectorRows = Object.entries(sd)
    .filter(([k]) => k !== "score" && k !== "sector")
    .map(([k,v]) => `<tr><td>${k}</td><td>${typeof v==="number"?v.toFixed(1):v}</td></tr>`)
    .join("");

  // EPS quality flags
  const flags = [];
  if (eq.eps_rev_divergence) flags.push(`<span class="badge badge-red">⚠ EPS/Rev дивергенция</span>`);
  if (eq.fcf_conversion != null && eq.fcf_conversion < 0.6) flags.push(`<span class="badge badge-amber">⚠ FCF конверсия ${eq.fcf_conversion.toFixed(2)}</span>`);
  if (eq.fcf_conversion != null && eq.fcf_conversion > 1.4) flags.push(`<span class="badge badge-green">✓ Высокая FCF конверсия ${eq.fcf_conversion.toFixed(2)}</span>`);
  if (eq.debt_ebitda != null && eq.debt_ebitda > 5) flags.push(`<span class="badge badge-red">⚠ Debt/EBITDA ${eq.debt_ebitda.toFixed(1)}×</span>`);
  const flagsHtml = flags.length ? flags.join(" ") : `<span class="badge badge-gray">Без предупреждений</span>`;

  // Column 2: Technical + Institutional
  const insiderColor = id2.insider_buy > id2.insider_sell ? "var(--green)" : id2.insider_sell > id2.insider_buy ? "var(--red)" : "var(--muted)";

  // Column 3: AI summary
  const aiHtml = d.ai_summary
    ? `<div class="ai-block">${d.ai_summary.replace(/\n/g,"<br>")}</div>`
    : `<div class="ai-block" style="color:var(--muted)">AI-анализ не запрашивался для этой компании.</div>`;

  td.innerHTML = `
  <div class="detail-panel">
    <div class="detail-col">
      <h4>Отраслевые метрики (Слой 1: ${d.sector_score.toFixed(1)}/30)</h4>
      <table class="kv-table">${sectorRows}</table>
      <br>
      <h4 style="margin-bottom:6px">EPS Quality (Слой 2: ${d.eps_quality_score.toFixed(1)}/20)</h4>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${flagsHtml}</div>
    </div>
    <div class="detail-col">
      <h4>Технический анализ (${d.tech_score.toFixed(1)}/20)</h4>
      <table class="kv-table">
        <tr><td>RSI (14)</td><td style="color:${d.rsi<30?'var(--red)':d.rsi>70?'var(--amber)':'var(--green)'}">${(d.rsi||0).toFixed(1)}</td></tr>
        <tr><td>Тренд</td><td><span class="badge ${TREND_CLASS[d.trend]||'badge-gray'}">${TREND_LABEL[d.trend]||d.trend}</span></td></tr>
        <tr><td>MACD</td><td>${td2.macd||"—"}</td></tr>
        <tr><td>EMA 9/21/50</td><td style="font-size:11px">${(td2.ema9||0).toFixed(2)} / ${(td2.ema21||0).toFixed(2)} / ${(td2.ema50||0).toFixed(2)}</td></tr>
        <tr><td>RS vs ${td2.etf||"ETF"}</td><td>${pct(d.rs_vs_etf)}</td></tr>
        <tr><td>Volume ratio</td><td>${(d.volume_ratio||1).toFixed(2)}×</td></tr>
      </table>
      <br>
      <h4>Инсайдеры · Short (Слой 3: ${d.inst_score.toFixed(1)}/15)</h4>
      <table class="kv-table">
        <tr><td>Покупки (30д)</td><td style="color:${insiderColor}">${id2.insider_buy||0}</td></tr>
        <tr><td>Продажи (30д)</td><td style="color:${id2.insider_sell>0?'var(--red)':'var(--muted)'}">${id2.insider_sell||0}</td></tr>
        <tr><td>Short interest</td><td style="color:${(d.short_pct||0)>10?'var(--red)':(d.short_pct||0)>5?'var(--amber)':'var(--muted)'}">${d.short_pct!=null?d.short_pct.toFixed(1)+"%":"—"}</td></tr>
      </table>
      <br>
      <h4>Катализаторы (Слой 4: ${d.catalyst_score.toFixed(1)}/10)</h4>
      <table class="kv-table">
        <tr><td>До отчёта</td><td>${cd.days_to_earnings!=null?cd.days_to_earnings+" дн":"—"}</td></tr>
        <tr><td>Beat rate (4q)</td><td>${cd.eps_beat_quarters!=null?cd.eps_beat_quarters+"/4":"—"}</td></tr>
        <tr><td>Avg surprise</td><td>${pct(cd.eps_surprise_avg)}</td></tr>
        <tr><td>Upgrades/Downgrades</td><td>${cd.recent_upgrades||0} / ${cd.recent_downgrades||0}</td></tr>
      </table>
    </div>
    <div class="detail-col">
      <h4>AI-анализ</h4>
      ${aiHtml}
      <br>
      <h4 style="margin-top:12px">Macro overlay</h4>
      <table class="kv-table">
        <tr><td>Множитель</td><td>${(d.macro_multiplier||1).toFixed(3)}</td></tr>
        <tr><td>VIX</td><td>${d.macro_data&&d.macro_data.vix!=null?d.macro_data.vix:"—"}</td></tr>
        <tr><td>10Y yield</td><td>${d.macro_data&&d.macro_data.yield_10y!=null?d.macro_data.yield_10y+"%":"—"}</td></tr>
        <tr><td>DXY chg (20d)</td><td>${d.macro_data&&d.macro_data.dxy_chg_pct!=null?pct(d.macro_data.dxy_chg_pct):"—"}</td></tr>
      </table>
    </div>
  </div>`;
  tr.appendChild(td);
  return tr;
}

applyFilters();
</script>
</body>
</html>
