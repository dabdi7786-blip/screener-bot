name: Scheduled Scan

on:
  schedule:
    - cron: "0 5 * * 1-5"   # 08:00 (UTC+3) пн-пт
  workflow_dispatch: {}

concurrency:
  group: screener-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run full scan (3 screeners + ставки + дашборд)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screener_bot.py

      - name: Commit updated state
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in screener1_results.csv screener2_results.csv screener3_results.csv last_rates.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore: update scan results [skip ci]"
          git push
