name: Scheduled Scan

on:
  schedule:
    - cron: "0 5 * * 1-5"   # 08:00 (UTC+3) пн-пт
  workflow_dispatch: {}

concurrency:
  group: screener-bot
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # IBKR-данные сюда не фетчатся живьём — раннер читает ibkr_snapshot.json,
      # закоммиченный локальным скриптом (ibkr_local_fetch.py) с машины, где
      # запущен IB Gateway. Если файла ещё нет — ibkr_fetcher.py вернёт {},
      # это не блокирует остальной скан.
      - name: Run full scan (3 screeners + ставки + IBKR + дашборд)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://dabdi7786-blip.github.io/screener-bot/
        run: python screener_bot.py

      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated state
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in screener1_results.csv screener2_results.csv screener3_results.csv last_rates.json; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d docs ] && git add docs/
          git diff --cached --quiet || git commit -m "chore: update scan results [skip ci]"
          git push
