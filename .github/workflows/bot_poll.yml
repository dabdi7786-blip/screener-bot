name: Bot Poll

on:
  schedule:
    - cron: "*/10 * * * *"   # проверка команд /scan, /scan1-3, /status и т.д.
  workflow_dispatch: {}

concurrency:
  group: screener-bot
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Проверить и обработать команды
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://dabdi7786-blip.github.io/screener-bot/
        run: python bot_server.py

      - name: Проверить, был ли сгенерирован дашборд (ручной /scan)
        id: check
        run: |
          if [ -f docs/index.html ]; then
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dashboard as Pages artifact
        if: steps.check.outputs.dashboard == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.dashboard == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated state
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in last_scan.json users.json screener1_results.csv screener2_results.csv screener3_results.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore: update bot state [skip ci]"
          git push
